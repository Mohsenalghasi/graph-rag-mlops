[project]
name = "graph-rag-mlops"
version = "0.1.0"
description = "Graph RAG with ingestion, evaluation, drift gates, tracking, and deployment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "pypdf>=5.0",
  "mlflow>=2.14",
  "pytest>=8.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
